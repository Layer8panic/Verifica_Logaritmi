<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Verifica di matematica su esponenziali e logaritmi spiegata passo passo, come in una chat.">
<title>Esponenziali e Logaritmi — Verifica spiegata</title>
<style>
:root{
  --bg:#f4f5fb; --card:#fff; --ink:#191c2e; --mute:#626882; --line:#e2e5f0;
  --pri:#4338ca; --pri2:#6366f1; --pri-soft:#eceeff; --on-pri:#fff;
  --me:#4f46e5; --on-me:#fff;
  --ok:#15803d; --ok2:#22c55e; --ok-soft:#e7f7ed; --ko:#dc2626; --ko-soft:#fdeded;
  --warn:#b45309; --warn-soft:#fff5e1; --math:#f1f2ff;
  --r:20px; --sh:0 2px 10px rgba(30,35,90,.07); --sh2:0 -6px 26px rgba(30,35,90,.10);
  --barh:120px; --toph:60px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1120; --card:#1b1e33; --ink:#eef0fb; --mute:#a2a8c4; --line:#2c3050;
  --pri:#8b93fa; --pri2:#6366f1; --pri-soft:#262a5a; --on-pri:#0f1120;
  --me:#6366f1; --on-me:#fff;
  --ok:#4ade80; --ok2:#22c55e; --ok-soft:#133022; --ko:#f87171; --ko-soft:#3b1818;
  --warn:#fbbf24; --warn-soft:#382a0e; --math:#23274a; --sh:0 2px 10px rgba(0,0,0,.3); --sh2:0 -6px 26px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(var(--toph) + 10px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.5;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- formule ---------- */
.m{font-family:"Cambria Math","STIX Two Math","Times New Roman",Times,serif;font-size:1.12em;white-space:nowrap}
.m i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;font-size:.9em;line-height:1.2}
.fr>span:first-child{border-bottom:1.4px solid currentColor;padding:0 .2em .06em}
.fr>span:last-child{padding:.06em .2em 0}
sup,sub{font-size:.7em;line-height:0}
sup{vertical-align:.75em} sub{vertical-align:-.3em}
sup .fr,sub .fr{font-size:.85em}
.rad{white-space:nowrap}.rs{font-size:1.05em}
.rc{border-top:1.4px solid currentColor;padding:.04em .08em 0 .04em}
.ri{font-size:.58em;vertical-align:.95em;margin-right:-.42em;position:relative;left:.05em}
.pa.tall{font-size:1.75em;font-weight:200;vertical-align:-.17em;line-height:0}
.fn{font-style:normal;margin-right:.08em}
.gap{display:inline-block;width:1em}
.op{margin:0 .2em}.op2{margin:0 .12em}
sup .op,sub .op,sup .op2,sub .op2{margin:0 .04em}

/* ---------- barra in alto ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:8px;height:56px}
.ib{min-width:44px;height:44px;border-radius:14px;display:inline-grid;place-items:center;background:var(--card);box-shadow:var(--sh);font-size:19px;font-weight:700}
.ib:active{transform:scale(.94)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib.txt{padding:0 12px;font-size:14px;gap:4px;grid-auto-flow:column}
@media (max-width:420px){#rulesBtn span{display:none}#rulesBtn{padding:0}}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri2),var(--ok2));transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- home ---------- */
.hero{margin:14px 0 6px;padding:22px 20px;border-radius:26px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#4338ca 0%,#7c3aed 60%,#db2777 125%);box-shadow:0 14px 36px rgba(67,56,202,.32)}
.hero h2{margin:0 0 6px;font-size:25px;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0;opacity:.93;font-size:16px}
.hero .fl{position:absolute;font-family:"Times New Roman",serif;font-style:italic;opacity:.16;font-size:40px;animation:fl 7s ease-in-out infinite;pointer-events:none}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.stats{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:center;margin-top:16px;background:rgba(255,255,255,.15);border-radius:18px;padding:12px 14px}
.stats .n{font-size:21px;font-weight:800;line-height:1.1}.stats .l{font-size:12.5px;opacity:.85}
.ring{width:52px;height:52px}.ring circle{fill:none;stroke-width:6}
.hero .go{margin-top:14px;width:100%;min-height:54px;border-radius:16px;background:#fff;color:#4338ca;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.hero .go:active{transform:scale(.98)}
.sec{margin:20px 0 0}
.sec .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 10px}
.sec h3{font-size:15px;margin:0;font-weight:800;line-height:1.3}
.sec .hd span{font-size:13px;color:var(--mute);font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.chip{min-height:56px;border-radius:16px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-weight:800;font-size:19px;position:relative;border:2px solid transparent}
.chip:active{transform:scale(.93)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.first::after{content:"★";position:absolute;top:3px;right:6px;font-size:11px;color:#f59e0b}
.chip.last{border-color:var(--pri2)}
.howto{margin:22px 0 10px;padding:16px;border-radius:var(--r);background:var(--card);box-shadow:var(--sh);font-size:15px}
.howto ol{margin:6px 0 0;padding-left:20px}.howto li{margin:4px 0}
.reset{display:block;margin:6px auto 30px;color:var(--mute);font-size:14px;text-decoration:underline;min-height:44px;padding:0 12px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:6px;padding:12px 0 18px}
.row{display:flex;gap:8px;align-items:flex-end;animation:in .38s cubic-bezier(.2,.8,.2,1) both;scroll-margin-bottom:calc(var(--barh) + 14px);scroll-margin-top:calc(var(--toph) + 14px)}
.row.prof+.row.prof .av{visibility:hidden}
.row.prof+.row.prof{margin-top:-2px}
.row.me{justify-content:flex-end}
.row.sp{margin-top:10px}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,#6366f1,#a855f7)}
.bub{background:var(--card);border-radius:20px 20px 20px 6px;padding:11px 14px;box-shadow:var(--sh);max-width:calc(100% - 42px);min-width:0}
.bub.wide{flex:1}
.me .bub{background:var(--me);color:var(--on-me);border-radius:20px 20px 6px 20px;max-width:80%;font-weight:600}
.bub.good{background:var(--ok-soft)}.bub.bad{background:var(--ko-soft)}.bub.warn{background:var(--warn-soft)}
.k{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--pri);margin-bottom:3px}
.good .k{color:var(--ok)}.bad .k{color:var(--ko)}.warn .k{color:var(--warn)}
.qimg{display:block;width:100%;height:auto;border-radius:12px;background:#fff;margin-top:6px;cursor:zoom-in}
@media (prefers-color-scheme:dark){.qimg{filter:invert(.9) hue-rotate(180deg)}}
.zoomhint{font-size:12.5px;color:var(--mute);margin-top:6px}
.mbox{margin-top:9px;padding:11px 12px;border-radius:12px;background:var(--math);overflow-x:auto;-webkit-overflow-scrolling:touch;border-left:4px solid var(--pri2);line-height:1.9}
.mbox .m{font-size:1.18em}
.glow{animation:glow 1.1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(99,102,241,.5)}100%{box-shadow:0 0 0 12px rgba(99,102,241,0)}}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
details.why summary{list-style:none;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:"+";color:var(--warn);font-size:24px;font-weight:400;transition:transform .3s;line-height:1}
details.why[open] summary::after{transform:rotate(45deg)}
details.why ul{margin:8px 0 0;padding-left:20px}details.why li{margin:6px 0}
.tips{margin-top:8px;font-size:15.5px}
.take{margin:12px 0 0;padding:16px 18px;border-radius:var(--r);color:#fff;background:linear-gradient(135deg,#0284c7,#6366f1);box-shadow:0 10px 26px rgba(2,132,199,.28);animation:in .45s both;scroll-margin-bottom:calc(var(--barh) + 14px)}
.take .k{color:#fff;opacity:.85}.take .t{font-size:18px;font-weight:700}

/* ---------- barra azioni fissa ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);
  box-shadow:var(--sh2);border-radius:22px 22px 0 0;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.dock .lab{font-size:13px;font-weight:700;color:var(--mute);margin:0 2px 7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dock .lab button{color:var(--pri);font-weight:800;font-size:13.5px;min-height:32px;padding:0 4px}
.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.lt{min-height:56px;border-radius:16px;background:var(--pri-soft);color:var(--pri);font-size:22px;font-weight:900;border:2px solid transparent;transition:transform .12s,background .25s}
.lt:active{transform:scale(.92)}
.lt.ko{background:var(--ko-soft);color:var(--ko);border-color:var(--ko);animation:shake .4s;opacity:.75}
.lt.ok{background:var(--ok2);color:#fff;animation:pop .5s}
.lt:disabled{cursor:default}
@keyframes pop{40%{transform:scale(1.14)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.acts{display:flex;gap:9px}
.btn{min-height:56px;border-radius:16px;padding:0 16px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--pri);color:var(--on-pri);flex:1;box-shadow:0 6px 16px rgba(67,56,202,.28)}
.btn.s{background:var(--pri-soft);color:var(--pri)}
.btn.g{background:var(--ok2);color:#fff;flex:1}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:all .3s}
.dots i.on{background:var(--pri2)}.dots i.cur{width:18px;background:var(--pri2)}

/* ---------- regole / zoom ---------- */
.shade{position:fixed;inset:0;background:rgba(8,10,25,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:24px 24px 0 0;max-height:86vh;max-height:86dvh;overflow:auto;overscroll-behavior:contain;
  transform:translateY(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet .sh{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px;z-index:1}
.sheet .sh h3{margin:0;font-size:19px}
.sheet h4{margin:14px 0 4px;color:var(--pri);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.sheet ul{margin:0;padding-left:18px}.sheet li{margin:8px 0}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;overflow:auto;padding:calc(64px + env(safe-area-inset-top)) 8px 30px;touch-action:pan-x pan-y pinch-zoom}
.zoom.on{display:block}
.zoom img{display:block;width:100%;max-width:1000px;margin:0 auto;border-radius:10px;background:#fff}
.zoom .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;background:#fff;color:#000}
.zoom p{color:#ccc;text-align:center;font-size:14px}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:80;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.view{animation:vin .3s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width:700px){.dock{left:50%;right:auto;width:680px;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <button class="ib" id="homeBtn" aria-label="Elenco esercizi">☰</button>
    <div class="ttl"><b id="t1">Esponenziali e Logaritmi</b><small id="t2">Verifica · Fila A</small></div>
    <button class="ib" id="prevBtn" aria-label="Esercizio precedente" hidden>‹</button>
    <button class="ib" id="nextBtn" aria-label="Esercizio successivo" hidden>›</button>
    <button class="ib txt" id="rulesBtn" aria-label="Apri le regole">📘<span>Regole</span></button>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>
<main class="wrap" id="app"></main>
<nav class="dock" id="dock" hidden><div class="wrap" id="dockIn"></div></nav>
<div class="shade" id="shade"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Regole da ricordare">
  <div class="sh"><h3>📘 Regole da ricordare</h3><button class="ib" id="closeRules" aria-label="Chiudi">✕</button></div><div id="rules"></div>
</aside>
<div class="zoom" id="zoom" role="dialog" aria-label="Testo ingrandito"><button class="ib x" id="zx" aria-label="Chiudi">✕</button><img id="zimg" alt=""><p>Allarga con due dita · tocca ✕ per chiudere</p></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>

const EX=[]; DATA.secs.forEach((s,si)=>s.ex.forEach(e=>{e.sec=s.title;e.si=si;EX.push(e)}));
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const app=$('#app'), dock=$('#dock'), dockIn=$('#dockIn');

const isDone=n=>S.done.includes(n), isFirst=n=>S.first.includes(n);
function markDone(n,first){ if(!isDone(n))S.done.push(n); if(first&&!isFirst(n))S.first.push(n); save(); setBar(); }

function setBar(){ $('#bar').style.width=(S.done.length/EX.length*100)+'%'; }

function syncBarH(){ document.documentElement.style.setProperty('--barh',(dock.hidden?0:dock.offsetHeight)+'px'); app.style.paddingBottom=(dock.hidden?24:dock.offsetHeight+16)+'px'; }
new ResizeObserver(syncBarH).observe(dock);
function confetti(){ if(reduce)return; const c=['#6366f1','#22c55e','#f59e0b','#ec4899','#0ea5e9'];
  for(let i=0;i<40;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%5];

if(navigator.vibrate===undefined) navigator.vibrate=()=>{};

    <span class="fl" style="right:16px;top:4px">a<sup>x</sup></span><span class="fl" style="right:96px;top:70px;animation-delay:-2s">log</span><span class="fl" style="right:22px;top:92px;animation-delay:-4s;font-size:30px">Δ</span>
    <h2>La verifica,<br>spiegata come a voce.</h2>
    <p>Prima rispondi tu, poi la risolviamo insieme un passo alla volta.</p>
    <div class="stats">
      <svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" stroke="rgba(255,255,255,.25)"/><circle cx="26" cy="26" r="22" stroke="#fff" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-d/EX.length)}" transform="rotate(-90 26 26)" style="transition:stroke-dashoffset 1s"/></svg>
      <div><div class="n">${d}/${EX.length}</div><div class="l">completati</div></div>
      <div><div class="n">★ ${S.first.length}</div><div class="l">giusti al primo colpo</div></div>
    </div>
    <button class="go" onclick="go('es${resume}')">${d===EX.length?'Ripassa dall\'esercizio 1':(d?'Continua':'Iniziamo')} · Esercizio ${d===EX.length?1:resume} →</button>
  </section>
  ${DATA.secs.map(s=>{const dn=s.ex.filter(e=>isDone(e.n)).length;return `<div class="sec"><div class="hd"><h3>${s.title}</h3><span>${dn}/${s.ex.length}</span></div>
    <div class="grid">${s.ex.map(e=>`<button class="chip ${isDone(e.n)?'done':''} ${isFirst(e.n)?'first':''} ${S.last===e.n?'last':''}" aria-label="Esercizio ${e.n}${isDone(e.n)?', completato':''}" onclick="go('es${e.n}')">${e.n}</button>`).join('')}</div></div>`}).join('')}
  <div class="howto"><b>Come funziona</b><ol>
    <li>Leggi l'esercizio (toccalo per ingrandirlo).</li>
    <li>Scegli la tua risposta con i tasti in basso.</li>
    <li>Premi <b>Avanti</b> per vedere un passaggio alla volta.</li>
    <li>Le formule sono sempre nel tasto <b>📘 Regole</b> in alto.</li></ol>
    <div style="margin-top:6px;color:var(--mute);font-size:14px">★ = risposta giusta al primo tentativo</div></div>
  ${d?'<button class="reset" id="reset">Azzera i miei progressi</button>':''}
  </div>`;
  const r=$('#reset'); if(r) r.onclick=()=>{ if(confirm('Vuoi davvero azzerare tutti i progressi?')){S={done:[],first:[],last:0};save();home();setBar();} };
  setBar(); scrollTo(0,0);
}

/* =================== ESERCIZIO =================== */
let run=0;
function exercise(n){
  const e=EX.find(x=>x.n===n); if(!e) return home();
  const my=++run, idx=EX.indexOf(e), total=e.steps.length, prev=EX[idx-1], nxt=EX[idx+1];
  S.last=n; save();
  $('#t1').textContent='Esercizio '+n+' / '+EX.length; $('#t2').textContent=e.sec.replace(/^\d+\.\s*/,'');
  $('#homeBtn').textContent='☰';
  const pb=$('#prevBtn'), nb=$('#nextBtn'); pb.hidden=nb.hidden=false;
  pb.disabled=!prev; nb.disabled=!nxt; pb.style.opacity=prev?1:.35; nb.style.opacity=nxt?1:.35;
  pb.onclick=()=>prev&&go('es'+prev.n); nb.onclick=()=>nxt&&go('es'+nxt.n);
  app.innerHTML=`<div class="view"><div class="chat" id="chat" aria-label="Spiegazione"></div><div id="end"></div></div>`;
  scrollTo(0,0);
  const chat=$('#chat');
  let phase='quiz', step=-1, tries=0, wrong=new Set(), hurry=false, skip=false, typingEl=null, queue=Promise.resolve();
  const alive=()=>my===run;

  function addRow(html,who='prof',cls='',extra=''){
    const r=document.createElement('div'); r.className='row '+who+(extra?' '+extra:'');
    r.innerHTML= who==='me' ? `<div class="bub">${html}</div>` : `<div class="av" aria-hidden="true">🧑‍🏫</div><div class="bub ${cls}">${html}</div>`;
    chat.appendChild(r); return r;
  }
  function scrollTo_(el){ requestAnimationFrame(()=>el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})); }
  // il prof "scrive": i messaggi entrano in coda, uno dopo l'altro
  function say(html,cls='',opt={}){
    queue=queue.then(async()=>{
      if(!alive())return;
      const wait=(hurry||reduce)?0:(opt.d??520);
      if(wait){ typingEl=addRow('<div class="typing" aria-label="Il prof sta scrivendo"><span></span><span></span><span></span></div>','prof','',opt.gap?'sp':''); scrollTo_(typingEl);
        let t=0; while(t<wait&&!hurry&&!skip){await sleep(40);t+=40;} skip=false; if(!alive())return; typingEl.remove(); typingEl=null; }
      const r=addRow(html,'prof',cls+(opt.wide?' wide':''),opt.gap?'sp':'');
      const mb=r.querySelector('.mbox'); if(mb&&!hurry) setTimeout(()=>mb.classList.add('glow'),200);
      scrollTo_(r); announce(html);
    });
    return queue;
  }
  function me(text){ queue=queue.then(()=>{ if(!alive())return; const r=addRow(text,'me','','sp'); scrollTo_(r); }); }

  /* --- dock --- */
  function dockQuiz(){
    dock.hidden=false;
    dockIn.innerHTML=`<div class="lab"><span>${tries?'Riprova:':'La tua risposta:'}</span><button id="idk">Non lo so 🙋</button></div>
      <div class="letters">${'ABCD'.split('').map(l=>`<button class="lt ${wrong.has(l)?'ko':''}" data-l="${l}" ${wrong.has(l)?'disabled aria-disabled="true"':''} aria-label="Risposta ${l}">${wrong.has(l)?'✗ ':''}${l}</button>`).join('')}</div>`;
    dockIn.querySelectorAll('.lt').forEach(b=>b.onclick=()=>answer(b.dataset.l,b));
    $('#idk').onclick=()=>{ me('Non lo so, me lo spieghi? 🙋'); say('Certo! Non sapere è il primo passo per imparare. Facciamolo insieme 💪','',{d:380}); begin(); };
    syncBarH();
  }
  function dockSteps(){
    dock.hidden=false;
    const dots=Array.from({length:total},(_,i)=>`<i class="${i<step?'on':''} ${i===step+1?'cur':''}"></i>`).join('');
    dockIn.innerHTML=`<div class="lab"><span>${step<0?'Pronto?':'Passo '+(step+1)+' di '+total}</span><div class="dots" aria-hidden="true">${dots}</div></div>
      <div class="acts"><button class="btn p" id="nx">${step<0?'Vediamo il primo passo':'Avanti'} ›</button><button class="btn s" id="allb" aria-label="Mostra tutti i passaggi">Tutto ⏭</button></div>`;
    $('#nx').onclick=nextStep; $('#allb').onclick=showAll; syncBarH();
  }
  function dockEnd(){
    dock.hidden=false;
    dockIn.innerHTML=`<div class="lab"><span>${isFirst(n)?'★ Giusto al primo colpo!':'Esercizio completato ✓'}</span><button id="again">↺ Rifai</button></div>
      <div class="acts">${prev?`<button class="btn s" id="pv" aria-label="Esercizio precedente">‹ ${prev.n}</button>`:''}
      ${nxt?`<button class="btn p" id="nv">Esercizio ${nxt.n} ›</button>`:`<button class="btn g" id="nv">Fine! 🎉 Vai al riepilogo</button>`}</div>`;
    if(prev) $('#pv').onclick=()=>go('es'+prev.n);
    $('#nv').onclick=()=>go(nxt?'es'+nxt.n:'');
    $('#again').onclick=()=>exercise(n);
    syncBarH();
  }
  function dockWait(){ dockIn.innerHTML=`<div class="acts"><button class="btn s" style="flex:1" disabled>Il prof sta scrivendo…</button></div>`; syncBarH(); }

  /* --- logica --- */
  function answer(l,btn){
    if(phase!=='quiz')return; tries++;
    me('Secondo me è la <b>'+l+'</b>');
    if(l===e.ans){
      btn.classList.add('ok'); confetti(); navigator.vibrate(30);
      const first=tries===1;
      say(first?`<div class="k">Esatto! 🎉</div>La <b>${l}</b> è proprio quella giusta, al primo colpo. Adesso vediamo <b>perché</b>, così sei sicuro di saperlo rifare.`
               :`<div class="k">Ora sì! ✅</div>La <b>${l}</b> è quella giusta. Ripercorriamo insieme il ragionamento.`,'good',{d:380});
      begin(first);
    } else {
      wrong.add(l); navigator.vibrate([20,40,20]);
      const w=e.why.find(x=>x.l.includes(l));
      say(`<div class="k">Non è la ${l} 🤔</div>${w?w.t:'Questa risposta nasce da un errore di calcolo.'}<div style="margin-top:6px;color:var(--mute);font-size:15px">${wrong.size>=3?'Ne resta solo una… 😉':'Riprova con un\'altra lettera, oppure premi «Non lo so».'}</div>`,'bad',{d:380});
      dockQuiz();
    }
  }
  function begin(first=false){
    phase='intro'; S._first=first; dockWait();
    say(e.intro,'',{gap:true}); say(`<div class="k">L'idea chiave</div>${e.idea}`);
    queue.then(()=>{ if(!alive())return; phase='steps'; hurry=false; dockSteps(); });
  }
  function nextStep(){
    if(phase!=='steps'||step>=total-1)return;
    step++; const [t,m]=e.steps[step]; const last=step===total-1;
    phase='busy'; dockWait();
    say(`<div class="k">Passo ${step+1} di ${total}</div>${t}<div class="mbox">${m}</div>`,'',{wide:true,gap:step===0});
    return queue.then(()=>{ if(!alive())return; if(last) finish(); else { phase='steps'; if(!hurry) dockSteps(); } });
  }
  async function showAll(){
    hurry=true; while(step<total-1 && alive()){ phase='steps'; await nextStep(); }
  }
  function finish(){
    phase='end'; dockWait();
    if(e.check) say(`<div class="k">Verifica ✔</div>${e.check}`,'good',{gap:true});
    say(`<div class="k">Risultato</div>La risposta giusta è la <b>${e.ans}</b>:&nbsp; ${e.res}`,'good',{gap:!e.check});
    const spec=e.why.filter(w=>w.l.length), gen=e.why.filter(w=>!w.l.length);
    say(`<details class="why"><summary>Perché le altre risposte sono sbagliate?</summary><ul>${spec.map(w=>`<li>${w.t}</li>`).join('')}</ul></details>${gen.length?`<div class="tips">${gen.map(w=>'⚠️ '+w.t).join('<br>')}</div>`:''}`,'warn',{wide:true});
    queue.then(()=>{ if(!alive())return;
      markDone(n,!!S._first);
      $('#end').innerHTML=`<div class="take"><div class="k">💡 Da ricordare</div><div class="t">${e.take}</div></div>`;
      scrollTo_($('#end .take')); hurry=false; dockEnd(); if(!nxt) confetti();
    });
  }
  // tocco sulla chat mentre il prof scrive = salta l'attesa
  chat.addEventListener('click',ev=>{ if(typingEl) skip=true; const img=ev.target.closest('.qimg'); if(img) openZoom(img.src); });

  // apertura
  addRow(`<div class="k">${e.sec}</div>Ecco l'esercizio ${n}. Leggilo con calma 👇<img class="qimg" src="${e.img}" alt="Testo dell'esercizio ${n}" decoding="async"><div class="zoomhint">🔍 Tocca l'immagine per ingrandirla</div>`,'prof','','');
  say('Tu che risposta daresti? Scegli una lettera qui sotto.','',{d:300});
  dockQuiz();
}

/* =================== ROUTER =================== */
function route(){
  closeAll();
  const m=location.hash.match(/^#es(\d+)$/);
  if(m) exercise(+m[1]); else home();
}
addEventListener('hashchange',route);
addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){closeAll();return;}
  if(sheet.classList.contains('on')||zoom.classList.contains('on')||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const k=ev.key.toUpperCase();
  if('ABCD'.includes(k)&&k.length===1){const b=dockIn.querySelector(`.lt[data-l="${k}"]:not(:disabled)`); if(b){b.click();ev.preventDefault();}}
  else if(ev.key==='Enter'||ev.key===' '||ev.key==='ArrowDown'){const b=$('#nx')||$('#nv'); if(b&&document.activeElement.tagName!=='BUTTON'){b.click();ev.preventDefault();}}
  else if(ev.key==='ArrowRight'){$('#nextBtn').hidden||$('#nextBtn').click();}
  else if(ev.key==='ArrowLeft'){$('#prevBtn').hidden||$('#prevBtn').click();}
});
setBar(); route();
</script>
